services:
  db:
    image: postgres:16
    container_name: robo_diagnostics_db
    environment:
      POSTGRES_USER: robo
      POSTGRES_PASSWORD: robo_dev_password
      POSTGRES_DB: robo_diagnostics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robo -d robo_diagnostics"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: robo_diagnostics_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://robo:robo_dev_password@db:5432/robo_diagnostics
      # Ollama runs on the HOST machine, not in a container (it needs
      # direct GPU access, which is more setup than it's worth
      # containerizing here). "host.docker.internal" is how Docker
      # Desktop (Windows/Mac) exposes the host to containers — on native
      # Linux Docker Engine this needs `extra_hosts` below instead.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:7b-instruct
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    container_name: robo_diagnostics_frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
