services:
  db:
    image: postgres:16
    container_name: robo_diagnostics_db
    environment:
      POSTGRES_USER: robo
      POSTGRES_PASSWORD: robo_dev_password
      POSTGRES_DB: robo_diagnostics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robo -d robo_diagnostics"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: robo_diagnostics_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://robo:robo_dev_password@db:5432/robo_diagnostics
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        # Corre server-side dentro del contenedor -> usa el nombre del
        # servicio de Docker ("backend"), no localhost/127.0.0.1.
        NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    container_name: robo_diagnostics_frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
